# The workspace root. The engine package lives in `engine/`; the WebAssembly adapter in
# `crates/slap5-wasm/`. There is no source here, and the lock file and `target/` stay at this level,
# which is why `target/release/pbrain-slap5.exe` keeps the path the README documents.
#
# `.cargo/config.toml` must stay here too: Cargo finds it by walking up from the *current directory*,
# not from the manifest, so a copy under `engine/` would be invisible to a build run from the root -
# and `target-cpu=native` silently selects the scalar board instead of AVX2 (3-4x slower, no warning).
# `engine/src/tests.rs::avx2_words_are_selected` fails when that happens.
[workspace]
resolver = "3"
members = ["engine", "crates/slap5-wasm"]
# A bare `cargo build|test|bench|run` stays engine-only, exactly as before the split; the wasm adapter
# is built with an explicit `-p slap5-wasm --target wasm32-unknown-unknown` (see web/scripts/build-wasm.mjs).
default-members = ["engine"]

# Profiles are read from the root manifest only, so this cannot stay in `engine/Cargo.toml`.
# The search tests are far too slow unoptimized (the AVX2 intrinsics are not inlined); debug assertions stay on.
[profile.test]
opt-level = 3

# Used by `scripts/build-wasm.mjs` only (`--profile wasm-release`), so the engine's own release profile
# - the one matches are measured with - is left untouched. `lto` cannot be set per package.
[profile.wasm-release]
inherits = "release"
lto = true
codegen-units = 1
