[package]
name = "slap5-wasm"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
# cdylib for the browser, rlib so `cargo test -p slap5-wasm` runs the marshalling natively.
crate-type = ["cdylib", "rlib"]

# The exact pins matter: the wasm-bindgen CLI that post-processes the binary must match the crate, and
# the CLI is installed per version (0.2.129 is both the crate's latest release and what CI installs).
# `web/scripts/build-wasm.mjs` asserts the two agree before it builds.
[dependencies]
slap5 = { path = "../../engine" }
js-sys = "=0.3.106"
wasm-bindgen = "=0.2.129"
